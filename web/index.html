<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintSpy</title>
    <link rel="icon" href="/logo.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PrintSpy">
    <meta name="theme-color" content="#2563eb">
</head>
<body>
    <div class="container">
        <header class="topbar">
            <a class="brand" href="#/" title="Dashboard"><img src="/logo.png" alt="PrintSpy" class="header-logo"><h1>PrintSpy</h1></a>
            <span class="spacer"></span>
            <span class="menu-wrap" id="power-controls" style="display:none">
                <button class="btn" onclick="toggleMenu(event,'power-menu')" aria-haspopup="true">&#9889;<span class="lbl"> Power</span> &#9662;</button>
                <div class="menu" id="power-menu">
                    <button onclick="bulkPower('on')">All printers on</button>
                    <button onclick="bulkPower('off')">All printers off</button>
                </div>
            </span>
            <button class="btn" onclick="openUploadDialog()" title="Upload a file to a printer"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></svg> Upload</button>
            <span class="menu-wrap usermenu">
                <button class="btn um-btn" onclick="toggleMenu(event,'user-menu')" aria-haspopup="true"><span class="avatar" id="user-avatar">?</span><span class="uname" id="user-name"></span><span class="caret">&#9662;</span></button>
                <div class="menu" id="user-menu">
                    <button onclick="openSettings()">&#9881; Settings</button>
                    <hr>
                    <form method="POST" action="/logout"><button type="submit">Log out</button></form>
                    <hr>
                    <div class="ver" id="app-version"></div>
                </div>
            </span>
        </header>

        <div class="connection-banner" id="connection-banner" style="display:none">
            <span class="banner-dot"></span>
            <span id="banner-text">Connection lost — reconnecting...</span>
        </div>

        <div id="dashboard">
            <div class="fleet" id="fleet"></div>

            <div id="printer-list"></div>
        </div>

        <main id="page" hidden></main>
    </div>










    <script src="/app.js"></script>
    <script src="/settings.js"></script>
    <script src="/files.js"></script>
    <script>route();</script>
</body>
</html>
